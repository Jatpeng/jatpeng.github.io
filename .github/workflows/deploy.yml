name: Deploy Hexo

on:
  push:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hexo-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Butterfly theme is usable in CI
        run: |
          # In this repo, themes/butterfly is tracked as a gitlink.
          # Without submodule content, the folder can exist but be unusable,
          # which makes Hexo emit empty HTML files.
          if [ -d themes/butterfly ] && [ ! -f themes/butterfly/layout/index.pug ]; then
            rm -rf themes/butterfly
          fi

      - name: Build Hexo site
        run: npx hexo clean && npx hexo generate

      - name: Deploy generated site to master branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master
